# Crosswalk World Cup chart. Argo CD syncs the long-running parts (inference
# Deployment, Service, route, dashboard); one-off Jobs are rendered from the
# same chart by scripts/submit-training.py and never appear in Argo CD.

image:
  # gpu.enabled picks which image runs. The ROCm image is built on the
  # homelab host (scripts/build-rocm-image.sh) and loaded straight into the
  # cluster's nodes, so it has no registry and must not be pulled.
  gpu:
    repository: crosswalk-world-cup
    tag: rocm-unset      # set to the tag build-rocm-image.sh prints
    pullPolicy: IfNotPresent
  # The CPU image CI publishes for each release tag. The streaming stages
  # after inference (tracking, indicators, ranking) always use it.
  cpu:
    repository: ghcr.io/griffinseibold/crosswalk-world-cup
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  # The Rust frame sampler, published by CI on version tags.
  ingest:
    repository: ghcr.io/griffinseibold/crosswalk-ingest
    tag: "0.2.0"
    pullPolicy: IfNotPresent

gpu:
  # true: request one AMD GPU and run the ROCm image.
  # false: no GPU request, CPU image (CI, smoke tests, and the fallback while
  # the cluster has no GPU device plugin).
  #
  # amd.com/gpu is advertised by AMD's Kubernetes device plugin. Until the
  # homelab installs it, a pod requesting it stays Pending forever with
  # "Insufficient amd.com/gpu"; use gpu.enabled=false until then.
  #
  # The homelab has ONE physical GPU, which its on-demand LLM also uses. Only
  # one pod can hold it at a time: a GPU pod here waits Pending while the LLM
  # runs (./scripts/lab-mode.py status in the homelab repo shows who holds it;
  # the LLM stops five minutes after nothing requests it).
  enabled: false
  resource: amd.com/gpu
  # GIDs that own /dev/kfd and /dev/dri/renderD* on the host, added as
  # supplemental groups so the non-root container user can open them.
  # Ubuntu 24.04: video is 44; render is allocated dynamically (often 992 or
  # 993). Check on the host with: getent group video render
  videoGid: 44
  renderGid: 992
  # Only needed if the card is not recognised by the ROCm build; gfx1030 is a
  # native target of ROCm 7.2.4, so leave empty unless validate fails with
  # "no binary for GPU".
  hsaOverrideGfxVersion: ""
  nodeSelector: {}
  tolerations: []

namespace:
  create: true
  # The homelab Gateway admits routes only from namespaces with this label.
  # This app does not use the homelab LLM, so it does NOT carry
  # homelab.local/llm: requested anywhere.
  labels:
    gateway.homelab/access: public

httpRoute:
  enabled: true
  # Claims crosswalk.<domain>. With pipeline.enabled the route serves the
  # leaderboard (ranking service) at http://crosswalk.localhost:8080/ and
  # the inference status at /status; otherwise only the inference service.
  domain: localhost
  hostnames: []
  parentRef:
    name: homelab
    namespace: gateway-system
    sectionName: http
  # Home-network access per the homelab's LAN contract (docs/operations.md
  # there): adds crosswalk.lab.internal on the Gateway's `lan` listener and
  # labels the namespace gateway.homelab/lan: "true". Off by default: anyone
  # on the Wi-Fi could open the page. Add the name to the router's DNS too.
  lan:
    enabled: false
    hostname: crosswalk.lab.internal
    sectionName: lan

# Kueue: batch Jobs (validate, train, benchmark, promote) wait in a queue for
# the GPU instead of piling up Pending. The homelab provides ClusterQueue
# `gpu` (ResourceFlavor amd-gpu, amd.com/gpu: 1) and manages only namespaces
# labelled kueue.homelab/queues: "true". This chart adds that namespace
# label and a LocalQueue pointing at the ClusterQueue; Jobs carry
# kueue.x-k8s.io/queue-name and are created suspended. Set false on a
# cluster without Kueue (the label and LocalQueue are then not rendered).
kueue:
  enabled: true
  localQueue: crosswalk
  clusterQueue: gpu
  namespaceLabels:
    kueue.homelab/queues: "true"

# Kafka (homelab: PLAINTEXT, auto-creation off; every component creates the
# topics it uses at startup, replication factor 1).
kafka:
  bootstrapServers: kafka.kafka.svc.cluster.local:9092

s3:
  endpoint: http://s3.ml-storage.svc.cluster.local:9000
  region: us-east-1
  # Created by the homelab: scripts/ml-credentials.py crosswalk
  # Keys AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY.
  credentialsSecret: s3-credentials

mlflow:
  trackingUri: http://mlflow.mlflow.svc.cluster.local:5000

inference:
  # 0 stops the service (and frees the GPU), 1 runs it. One GPU, so never 2.
  replicaCount: 1
  # Serve models:/<registeredModel>@champion from the MLflow registry (the
  # version `crosswalk promote` approved) instead of model.checkpoint.
  # After a promotion or rollback, restart the Deployment to load it.
  servePromoted: false
  registeredModel: crosswalk-detector
  # Rendered into a ConfigMap and passed as --config. Same schema as
  # configs/inference.yaml (src/crosswalk/config.py, InferenceConfig).
  # With pipeline.enabled the chart switches mode to kafka.
  config:
    mode: file
    device: auto
    precision: fp32
    model:
      name: fcos_resnet50_fpn
      weights: COCO_V1
      # null: the pretrained COCO model. To serve the promoted fine-tuned
      # model, set inference.servePromoted=true (below) instead of a path.
      checkpoint: null
      min_size: 720
      max_size: 1280
      score_threshold: 0.3
    batching:
      strategy: dynamic
      max_batch_size: 8
      max_wait_ms: 10
      queue_size: 64
    source:
      videos:
        - s3://datasets/footage/
      realtime: true
      loop: true
      resize: [1280, 720]
      cache_dir: /cache/footage
    output:
      dir: /data/detections
      s3_prefix: s3://datasets/detections/
    server:
      port: 8080
    kafka:
      group: crosswalk-inference
      partitions: 3
      max_records: 64
      fetch_workers: 8
      resize: null
  resources:
    gpu:
      requests: {cpu: "2", memory: 6Gi}
      limits: {memory: 12Gi}
    cpu:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 4Gi}
  # Footage downloads, torch weights and MIOpen kernel cache. emptyDir is
  # enough; a PVC keeps them across restarts (saves re-downloading weights and
  # re-tuning kernels on every rollout).
  cache:
    persistent: true
    size: 20Gi
    storageClassName: ""
  serviceMonitor:
    enabled: true
    interval: 15s

job:
  # Rendered only by scripts/submit-training.py (job.enabled=true with
  # --show-only), never by Argo CD.
  enabled: false
  kind: validate        # validate | train | benchmark | promote
  name: ""
  # The crosswalk YAML config for train/benchmark (--set-file job.config=...).
  config: ""
  # Extra arguments after the subcommand, e.g. [--set, epochs=1].
  args: []
  # s3://bucket/prefix=/local/dir pairs downloaded by an init container.
  sync: []
  # Generate the synthetic dataset into /scratch/data/synthetic first.
  synthetic: false
  # Extra environment for the main container, e.g. fault injection for
  # Experiment B: [{name: CROSSWALK_FAULT_AT_STEP, value: "500"}].
  env: []
  # A killed pod is retried (and resumes from its last checkpoint) this many
  # times before the Job gives up.
  backoffLimit: 4
  # Finished Jobs (and their ConfigMaps) are deleted after a day.
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 172800
  # /scratch: datasets and the local checkpoint copy. Ephemeral by default;
  # set a size and storageClassName to use a generic ephemeral PVC instead.
  scratch:
    sizeLimit: 100Gi
    storageClassName: ""
  # /dev/shm for DataLoader worker processes (the default 64 MiB is too
  # small for batches of 720p images).
  shmSize: 4Gi
  resources:
    gpu:
      requests: {cpu: "4", memory: 12Gi}
      limits: {memory: 24Gi}
    cpu:
      requests: {cpu: "2", memory: 4Gi}
      limits: {memory: 8Gi}

# Milestone 3: the streaming pipeline. Off by default so the chart still
# installs where Kafka does not exist; turn on once the homelab's Kafka is up.
pipeline:
  enabled: false
  ingest:
    replicaCount: 1
    # Recorded, blurred clips (docs/data.md) synced from S3 into an emptyDir
    # by an init container, then played in a loop at their own frame rate.
    footage: s3://datasets/footage/
    sampling: "fps:5"
    overflow: block          # block (lose nothing) | drop (bounded latency)
    buffer: 32
    publishers: 4
    realtime: true
    loop: true
    resize: "1280x720"
    framesBucket: datasets
    framesPrefix: frames
    partitions: 3
    footageSizeLimit: 20Gi
    resources:
      requests: {cpu: 500m, memory: 256Mi}
      limits: {memory: 1Gi}
  tracking:
    replicaCount: 1
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 1Gi}
  indicators:
    replicaCount: 1
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {memory: 1Gi}
  ranking:
    # SQLite, one writer: exactly one replica (docs/ranking.md).
    storage:
      size: 1Gi
      storageClassName: ""
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 512Mi}
  # configs/stages.yaml, inlined (StagesConfig in src/crosswalk/stages.py).
  # cameras_dir and database are fixed by the chart's mounts.
  stages:
    tracking:
      kafka: {group: crosswalk-tracking, partitions: 3}
      high_threshold: 0.5
      low_threshold: 0.1
      min_hits: 2
      max_age_s: 1.0
      reorder_window: 8
    indicators:
      kafka: {group: crosswalk-indicators, partitions: 3}
      window_s: 60
    ranking:
      kafka: {group: crosswalk-ranking}
      min_observed_s: 600
      min_windows: 5
      min_pedestrian_minutes: 30
      confidence: 0.95
      period_s: null
      snapshot_every_s: 300
      change_window_s: 86400
  # Per-camera configs (configs/cameras/*.yaml): name -> YAML text. The
  # chart ships the example from the repository (--set-file works too).
  cameras: {}
  serviceMonitor:
    interval: 15s

dashboard:
  enabled: true

# PrometheusRules (kube-prometheus-stack selects rules labelled
# release: kube-prometheus-stack). Pipeline alerts render only with
# pipeline.enabled; the inference latency alert always.
alerts:
  enabled: true
  # End-to-end p99 per frame in the inference service, seconds.
  inferenceP99BudgetSeconds: 0.5
  # No new ranking window for this many seconds while ingest publishes.
  rankingStaleAfterSeconds: 3600
  # Lag must have grown for this long (and be above minLag) to alert.
  lagGrowingFor: 15m
  minLag: 500
