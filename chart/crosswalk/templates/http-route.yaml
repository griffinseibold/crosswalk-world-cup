{{- if .Values.httpRoute.enabled }}
{{- $backend := ternary (printf "%s-ranking" .Chart.Name) .Chart.Name .Values.pipeline.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "crosswalk.labels" . | nindent 4 }}
spec:
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  {{- else if .Values.httpRoute.domain }}
  hostnames:
    - {{ printf "%s.%s" .Chart.Name .Values.httpRoute.domain }}
  {{- end }}
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName }}
  rules:
    {{- if .Values.pipeline.enabled }}
    # The inference service's status page stays reachable next to the
    # leaderboard. Probes and /metrics are not routed.
    - matches:
        - path: {type: Exact, value: /status}
      backendRefs:
        - name: {{ .Chart.Name }}
          port: 80
    {{- end }}
    # Read-only: the leaderboard page and its JSON API (pipeline), or the
    # inference status page (inference only).
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $backend }}
          port: 80
{{- if .Values.httpRoute.lan.enabled }}
---
# Home-network access (homelab LAN contract): a separate route on the
# Gateway's HTTPS `lan` listener with a *.lab.internal name. The namespace
# also carries gateway.homelab/lan: "true" (namespace.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Chart.Name }}-lan
  labels:
    {{- include "crosswalk.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.httpRoute.lan.hostname | quote }}
  parentRefs:
    - name: {{ .Values.httpRoute.parentRef.name }}
      namespace: {{ .Values.httpRoute.parentRef.namespace }}
      sectionName: {{ .Values.httpRoute.lan.sectionName }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: {{ $backend }}
          port: 80
{{- end }}
{{- end }}
