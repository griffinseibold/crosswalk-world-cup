apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-inference-config
  labels:
    {{- include "crosswalk.labels" . | nindent 4 }}
data:
  inference.yaml: |
    {{- $config := deepCopy .Values.inference.config }}
    {{- if .Values.pipeline.enabled }}
    {{- $_ := set $config "mode" "kafka" }}
    {{- end }}
    {{- toYaml $config | nindent 4 }}
