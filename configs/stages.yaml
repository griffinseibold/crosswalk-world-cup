# Streaming stages after inference (chart: tracking, indicators and ranking
# Deployments). Keys: src/crosswalk/stages.py. The Kafka broker comes from
# KAFKA_BOOTSTRAP_SERVERS.
tracking:
  kafka:
    group: crosswalk-tracking
    partitions: 3
  high_threshold: 0.5
  low_threshold: 0.1
  min_hits: 2
  max_age_s: 1.0
  reorder_window: 8
indicators:
  kafka:
    group: crosswalk-indicators
    partitions: 3
  cameras_dir: configs/cameras
  window_s: 60
ranking:
  kafka:
    group: crosswalk-ranking
  database: /data/ranking.sqlite3   # on the ranking PersistentVolumeClaim
  cameras_dir: configs/cameras
  # A crossing is ranked only with at least this much data.
  min_observed_s: 600
  min_windows: 5
  min_pedestrian_minutes: 30
  confidence: 0.95
  period_s: null          # null: all history; e.g. 604800 for the last week
  snapshot_every_s: 300
  change_window_s: 86400  # rank changes are "since about a day ago"
