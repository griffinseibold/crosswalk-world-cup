# Copy to inventory.ini (git-ignored) and fill in your rented VM.
# Nothing here is specific to a cloud provider: any fresh Ubuntu 24.04
# machine with one NVIDIA GPU, reachable over SSH as a sudo-capable user.
[gpu]
gpu-vm ansible_host=203.0.113.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/rented-gpu
