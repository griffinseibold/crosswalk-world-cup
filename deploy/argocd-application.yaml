# Register Crosswalk World Cup with the homelab's Argo CD (once):
#   kubectl --context kind-homelab-dev apply -f deploy/argocd-application.yaml
# Before the first sync, create the S3 credentials from the homelab repo:
#   ./scripts/ml-credentials.sh crosswalk
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crosswalk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/griffinseibold/crosswalk-world-cup
    path: chart/crosswalk
    targetRevision: main
    helm:
      # CPU fallback until the homelab runs AMD's GPU device plugin. To use
      # the GPU, build the ROCm image on the host (scripts/build-rocm-image.sh)
      # and set these from the Argo CD UI or here:
      #   gpu.enabled=true, image.gpu.tag=<tag the script printed>
      parameters:
        - name: gpu.enabled
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: crosswalk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
