# promtool test rules alerts-test.yaml (rules.yaml is generated in CI from
# the chart: see .github/workflows/ci.yaml, job lint-chart).
rule_files:
  - rules.yaml
evaluation_interval: 1m
tests:
  - name: dead letters fire as soon as any appear
    interval: 1m
    input_series:
      - series: 'crosswalk_stage_dead_letters_total{namespace="crosswalk", stage="inference"}'
        values: '0 0 0 1 1 1'
      - series: 'crosswalk_stage_dead_letters_total{namespace="crosswalk", stage="tracking"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: CrosswalkDeadLetters
        exp_alerts:
          - exp_labels: {severity: warning, namespace: crosswalk, stage: inference}

  - name: lag that keeps growing fires, steady lag does not
    interval: 1m
    input_series:
      - series: 'crosswalk_stage_consumer_lag{namespace="crosswalk", stage="tracking", topic="t", partition="0"}'
        values: '1000+100x40'
      - series: 'crosswalk_stage_consumer_lag{namespace="crosswalk", stage="indicators", topic="t", partition="0"}'
        values: '2000x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: CrosswalkConsumerLagGrowing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: crosswalk, stage: tracking}

  - name: a component that cannot be scraped is down
    interval: 1m
    input_series:
      - series: 'up{namespace="crosswalk", service="crosswalk-tracking"}'
        values: '1 1 0x15'
      - series: 'up{namespace="crosswalk", service="crosswalk-ranking"}'
        values: '1x17'
    alert_rule_test:
      - eval_time: 15m
        alertname: CrosswalkStageDown
        exp_alerts:
          - exp_labels: {severity: warning, namespace: crosswalk, service: crosswalk-tracking}

  - name: rankings go stale only while frames are flowing
    interval: 1m
    input_series:
      - series: 'crosswalk_ranking_last_update_timestamp_seconds{namespace="crosswalk"}'
        values: '0x120'
      - series: 'crosswalk_ingest_frames_published_total{namespace="crosswalk", camera="a"}'
        values: '0+10x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: CrosswalkRankingsStale
        exp_alerts: []
      - eval_time: 80m
        alertname: CrosswalkRankingsStale
        exp_alerts:
          - exp_labels: {severity: warning, namespace: crosswalk}

  - name: inference p99 over budget while frames flow
    interval: 1m
    input_series:
      # Every frame lands in the 0.75-1.0 s bucket: p99 ~ 1 s > 0.5 s budget.
      - series: 'crosswalk_end_to_end_latency_seconds_bucket{namespace="crosswalk", le="0.5"}'
        values: '0x40'
      - series: 'crosswalk_end_to_end_latency_seconds_bucket{namespace="crosswalk", le="1.0"}'
        values: '0+60x40'
      - series: 'crosswalk_end_to_end_latency_seconds_bucket{namespace="crosswalk", le="+Inf"}'
        values: '0+60x40'
      - series: 'crosswalk_frames_total{namespace="crosswalk", stream="a"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: CrosswalkInferenceLatencyHigh
        exp_alerts:
          - exp_labels: {severity: warning, namespace: crosswalk}
